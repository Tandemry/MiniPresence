name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: ./scripts/build.ps1
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/MiniPresence-*-windows-x64.zip
